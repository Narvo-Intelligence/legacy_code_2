# Cloud Build: build backend image and deploy to Cloud Run (CD).
# Trigger must point to this file (e.g. Cloud Build trigger "Configuration" = cloudbuild.yaml).
# Set substitution _REGION (e.g. europe-west1) in the trigger or below.
# options.logging required when trigger uses a custom service_account (no logs_bucket).
substitutions:
  _REGION: europe-west1

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Build and push in one step so the image exists in the same container for push.
  # env passes Cloud Build substitutions into the script (script block does not expand $PROJECT_ID etc.).
  - name: 'gcr.io/cloud-builders/docker'
    id: build-push
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'COMMIT_SHA=$COMMIT_SHA'
    script: |
      #!/bin/sh
      set -e
      docker build -f backend/Dockerfile \
        -t gcr.io/$PROJECT_ID/narvo-backend:$COMMIT_SHA \
        -t gcr.io/$PROJECT_ID/narvo-backend:latest \
        backend
      docker push gcr.io/$PROJECT_ID/narvo-backend:$COMMIT_SHA
      docker push gcr.io/$PROJECT_ID/narvo-backend:latest

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['build-push']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'narvo-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/narvo-backend:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/narvo-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/narvo-backend:latest'
