# Cloud Build: build backend image and deploy to Cloud Run (CD).
# Trigger must point to this file (e.g. Cloud Build trigger "Configuration" = cloudbuild.yaml).
# Set substitution _REGION (e.g. europe-west1) in the trigger or below.
# options.logging required when trigger uses a custom service_account (no logs_bucket).
substitutions:
  _REGION: europe-west1

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'backend/Dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/narvo-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/narvo-backend:latest'
      - 'backend'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'narvo-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/narvo-backend:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/narvo-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/narvo-backend:latest'
