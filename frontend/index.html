<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="/narvo_logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/narvo_logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/narvo-icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/narvo-icon-192.png" />
    <link rel="apple-touch-icon" href="/narvo-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#18542A" />
    <meta name="description" content="Narvo — Africa's audio news, synthesised and spoken. AI reads 39 sources so you don't have to." />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NARVO" />
    <meta property="og:title" content="Narvo | Africa's voice, in your ears" />
    <meta property="og:description" content="AI-synthesised audio news for Africa. Five Nigerian languages. Verified by the Truth Tag." />
    <meta property="og:image" content="/screenshot-wide.png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Narvo — Audio-first AI news platform for Africa" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Narvo | Africa's voice, in your ears" />
    <meta name="twitter:description" content="AI-synthesised audio news for Africa. Five Nigerian languages. Verified by the Truth Tag." />
    <meta name="twitter:image" content="/screenshot-wide.png" />
    <meta name="twitter:image:alt" content="Narvo — Audio-first AI news platform for Africa" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Narvo" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      Design System v4 — Typefaces
      display : Fraunces (variable serif) — headlines H1-H4
      body    : Plus Jakarta Sans         — body copy, nav, buttons
      mono    : Geist Mono                — labels, stamps, metadata
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces: variable, optical size + italic axes -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600;1,9..144,700&display=swap" rel="stylesheet" />
    <!-- Plus Jakarta Sans: body copy and UI -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Geist Mono: technical labels, timestamps, stamps -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/style.css" rel="stylesheet" />

    <title>Narvo | Africa's voice, in your ears</title>
    <style>
      body { -webkit-tap-highlight-color: transparent; }
      @supports (padding-top: env(safe-area-inset-top)) {
        body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
      }
    </style>
  </head>
  <body>
    <script>
      (function() {
        var themeColor = '#18542A';
        try {
          var saved = localStorage.getItem('narvo_theme');
          if (saved === 'dark') themeColor = '#0e3319';
        } catch (e) {}
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', themeColor);
        document.documentElement.setAttribute('data-theme', 'narvo');
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
    <script>
      (function() {
        var isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js')
              .then(function(reg) { if (isDev) console.log('[Narvo] SW registered:', reg.scope); })
              .catch(function(err) { if (isDev) console.log('[Narvo] SW failed:', err); });
          });
        }
      })();
      window.__NARVO_STANDALONE = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    </script>
  </body>
</html>
